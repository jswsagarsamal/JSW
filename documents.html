<html><head><title>Documents</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div class="container py-5"><h1>Document QR Generator</h1><input id="url" class="form-control" placeholder="Document URL"><button class="btn btn-primary mt-3" onclick="gen()">Generate</button><div id="qrcode" class="mt-3"></div></div><script>function gen(){document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),document.getElementById('url').value);}</script></body></html>
